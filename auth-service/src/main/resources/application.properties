spring.application.name=auth-service
server.port=${SERVER_PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db
logging.level.root=${LOG_LEVEL:INFO}
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.connection-timeout=3000
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
security.jwt.issuer=${JWT_ISSUER:devops-azure-lab}
security.jwt.audience=${JWT_AUDIENCE:lab-api}
security.jwt.public-key=${JWT_PUBLIC_KEY:file:/run/keys/public.pem}
security.jwt.private-key=${JWT_PRIVATE_KEY:file:/run/keys/private.pem}
security.jwt.ttl-seconds=${JWT_TTL_SECONDS:900}
bootstrap.username=${BOOTSTRAP_USERNAME}
bootstrap.password=${BOOTSTRAP_PASSWORD}
